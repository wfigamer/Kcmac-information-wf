<title>KCMAC Education</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f7;--card:#fff;--ink:#14233c;--mut:#5b6b82;--line:#d3dde8;--acc:#f5b700;--on-acc:#14233c;--me:#14233c;--on-me:#fff;--bot:#e2eaf3;--key:#f3f6fa;--op:#dfe8f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1726;--card:#17233a;--ink:#eaf0f8;--mut:#9fb0c6;--line:#2a3a56;--me:#f5b700;--on-me:#14233c;--bot:#22314d;--key:#1e2d47;--op:#2a3d5e}}
:root[data-theme="dark"]{--bg:#0e1726;--card:#17233a;--ink:#eaf0f8;--mut:#9fb0c6;--line:#2a3a56;--me:#f5b700;--on-me:#14233c;--bot:#22314d;--key:#1e2d47;--op:#2a3d5e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Hind Siliguri",system-ui,sans-serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--acc);color:var(--on-acc);padding:14px 18px 10px;border-radius:0 0 22px 22px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
#logo{width:50px;height:50px;flex:none;border-radius:12px;background:#fff;padding:3px;object-fit:contain}
header h1{margin:0;font-size:19px;line-height:1.2;font-weight:700;letter-spacing:.2px}
#lang{flex:none;display:flex;border:1.5px solid var(--on-acc);border-radius:999px;overflow:hidden}
#lang button{font:inherit;font-weight:700;font-size:13px;border:0;background:transparent;color:var(--on-acc);padding:4px 10px;cursor:pointer}
#lang button[aria-pressed="true"]{background:var(--on-acc);color:var(--acc)}
header p{margin:0;font-size:13px;line-height:1.3;font-weight:500}
nav{display:flex;flex-wrap:nowrap;flex:none;overflow-x:auto;overflow-y:hidden;gap:8px;padding:10px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
nav::-webkit-scrollbar{display:none}
nav .tab{flex:none;scroll-snap-align:center}
.tab{flex:1 0 auto;white-space:nowrap;padding-left:12px!important;padding-right:12px!important;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:500;padding:7px 6px;border-radius:12px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 16px 14px}
section{display:none;flex:1;min-height:0;flex-direction:column}
section.on{display:flex}
#log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:8px 2px}
.m{max-width:88%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.m.bot{background:var(--bot);border-bottom-left-radius:4px;align-self:flex-start}
.m.me{background:var(--me);color:var(--on-me);border-bottom-right-radius:4px;align-self:flex-end}
.chips{display:flex;gap:7px;padding:6px 0;overflow-x:auto;flex:none}
.chip{flex:none;white-space:nowrap;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:5px 11px;border-radius:999px;cursor:pointer}
form.row{display:flex;gap:8px;margin-top:6px}
form.row input{flex:1;min-width:0;font:inherit;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
form.row button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:0 18px;background:var(--acc);color:var(--on-acc);cursor:pointer}
.calc{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px;margin-top:8px}
.tag{font-size:13px;color:var(--mut);display:flex;justify-content:space-between}
#expr{min-height:22px;text-align:right;color:var(--mut);font-size:15px;margin-top:6px}
#out{text-align:right;font-size:44px;font-weight:500;line-height:1.2;overflow-x:auto;white-space:nowrap;margin-bottom:10px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.k{font:inherit;font-size:22px;font-weight:500;border:0;border-radius:14px;padding:14px 0;background:var(--key);color:var(--ink);cursor:pointer}
.k.o{background:var(--op)}
.k.e{background:var(--acc);color:var(--on-acc);font-weight:700}
.k:active{transform:scale(.96)}
@media(prefers-reduced-motion:reduce){.k:active{transform:none}}
.tab{font-size:14px;line-height:1.25}
.help{margin-bottom:12px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:18px;margin-top:8px}
.help .who{margin:0 0 14px;color:var(--mut)}
.num{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--key);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.phone{font-size:22px;font-weight:700;letter-spacing:.3px;user-select:all;direction:ltr}
.acts{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;font:inherit;font-weight:700;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:12px 10px;cursor:pointer;background:var(--acc);color:var(--on-acc)}
.btn.alt{background:var(--op);color:var(--ink)}
#copied,#copied2{min-height:22px;margin:10px 0 0;color:var(--mut);font-size:14px}
.lbl{font-size:13px;color:var(--mut);margin:12px 0 4px}
.addr{margin:0;font-weight:500}
.shot{width:100%;border-radius:14px;margin-top:6px;display:block}
.num.sm #p{font-size:18px}
.num span.phone.mail{font-size:16px;word-break:break-all}
.team{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px;margin-top:8px;overflow:hidden}
.team h2{margin:0 0 10px;font-size:20px}
.stage{display:grid;border-radius:16px;overflow:hidden;background:var(--key)}
.slide{grid-area:1/1;opacity:0;transform:translateX(40px);transition:opacity .7s ease,transform .7s ease;pointer-events:none;visibility:hidden}
.slide.on{opacity:1;transform:none;pointer-events:auto;visibility:visible}
.slide.out{transform:translateX(-40px)}
.ph{height:300px;overflow:hidden;background:#fff}
.ph img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;transform:scale(1)}
.slide.on .ph img{animation:kb 6s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.cap{padding:12px 14px 14px;animation:none}
.slide.on .cap{animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cap b{display:block;font-size:19px;line-height:1.35}
.cap .r{display:block;font-weight:500;margin-top:2px;color:var(--ink)}
.cap .s{display:block;font-size:14px;color:var(--mut);margin-top:4px}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.ctl button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:8px 14px;background:var(--op);color:var(--ink);cursor:pointer}
.dots{display:flex;gap:8px}
.dots button{width:12px;height:12px;padding:0;border-radius:50%;background:var(--line)}
.dots button[aria-current="true"]{background:var(--acc);box-shadow:0 0 0 2px var(--ink)}
@media(prefers-reduced-motion:reduce){.slide,.slide.out{transition:opacity .3s;transform:none}.slide.on .ph img,.slide.on .cap{animation:none}}
.stats{display:grid;gap:12px;margin-top:8px}
.st{border-radius:18px;padding:18px 12px;text-align:center;background:#f5a01f;color:#14233c;border:1.5px solid rgba(20,35,60,.25)}
.st:first-child{background:#299155;color:#fff}
.st .n{font-size:44px;font-weight:700;line-height:1.1;color:inherit}
.st .t{font-size:18px;font-weight:500;margin-top:2px;color:#14233c}
.st:first-child .t{color:#fff}
.st{animation:pop .6s ease both}
.st:nth-child(2){animation-delay:.1s}.st:nth-child(3){animation-delay:.2s}.st:nth-child(4){animation-delay:.3s}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.st{animation:none}}
.mapimg{width:100%;border-radius:14px;display:block;margin-top:10px}
.big{font-size:17px;word-break:normal;overflow-wrap:anywhere}
.ico{font-size:44px;line-height:1;margin:2px 0 8px}
</style></head>

let ti=0,tplay=!matchMedia('(prefers-reduced-motion: reduce)').matches,ttimer=null;
function showSlide(n){
  const sl=document.querySelectorAll('#tlist .slide'),dots=document.querySelectorAll('#tlist .dots button');
  const old=ti;ti=(n+TEAM.length)%TEAM.length;
  sl.forEach((x,i)=>{x.classList.toggle('on',i===ti);x.classList.toggle('out',i===old&&i!==ti);x.setAttribute('aria-hidden',i!==ti)});
  dots.forEach((d,i)=>d.setAttribute('aria-current',i===ti));
}
function teamTick(){clearInterval(ttimer);if(tplay)ttimer=setInterval(()=>{if($('#team').classList.contains('on'))showSlide(ti+1)},4500)}

  });
  w.appendChild(st);
  const ctl=document.createElement('div');ctl.className='ctl';
  const pv=document.createElement('button');pv.type='button';pv.textContent='‹ '+t.prev;pv.onclick=()=>{showSlide(ti-1);teamTick()};

let sraf=0;
function runStats(){
  cancelAnimationFrame(sraf);
  const els=document.querySelectorAll('#slist .n');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){els.forEach((e,i)=>e.textContent=numFmt(STATS[i].v)+STATS[i].suf);return}
  const t0=performance.now(),D=1400;
  (function f(t){const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);
    els.forEach((x,i)=>x.textContent=numFmt(Math.round(STATS[i].v*e))+STATS[i].suf);

}

const ABOUT=[{"t": {"en": "About the school", "bn": "\u09b8\u09cd\u0995\u09c1\u09b2 \u09aa\u09b0\u09bf\u099a\u09bf\u09a4\u09bf"}, "en": ["K C Model School & College (KCMSC) is at 275 Prembagan, Dakshinkhan, Dhaka-1230, near Uttara.", "It was founded in 2014 by industrialist Al-Hajj Md. Khosru Chowdhury (CIP), founder of Nipa Group.", "The school began its journey on 1 January 2015 with 2,200 students.", "It is housed in a ten-storied building and teaches from Play Group to Grade Twelve, in both Bangla and English versions of the national curriculum.", "Mission: to help students explore their full potential physically, mentally and spiritually and become responsible global citizens."], "bn": ["\u0995\u09c7 \u09b8\u09bf \u09ae\u09a1\u09c7\u09b2 \u09b8\u09cd\u0995\u09c1\u09b2 \u0985\u09cd\u09af\u09be\u09a8\u09cd\u09a1 \u0995\u09b2\u09c7\u099c (\u0995\u09c7\u09b8\u09bf\u098f\u09ae\u098f\u09b8\u09b8\u09bf) \u0989\u09a4\u09cd\u09a4\u09b0\u09be\u09b0 \u0995\u09be\u099b\u09c7 \u09e8\u09ed\u09eb \u09aa\u09cd\u09b0\u09c7\u09ae\u09ac\u09be\u0997\u09be\u09a8, \u09a6\u0995\u09cd\u09b7\u09bf\u09a3\u0996\u09be\u09a8, \u09a2\u09be\u0995\u09be-\u09e7\u09e8\u09e9\u09e6 \u098f \u0985\u09ac\u09b8\u09cd\u09a5\u09bf\u09a4\u0964", "\u09e8\u09e6\u09e7\u09ea \u09b8\u09be\u09b2\u09c7 \u09b6\u09bf\u09b2\u09cd\u09aa\u09aa\u09a4\u09bf \u0986\u09b2\u09b9\u09be\u099c\u09cd\u09ac \u09ae\u09cb. \u0996\u09b8\u09b0\u09c1 \u099a\u09cc\u09a7\u09c1\u09b0\u09c0 (\u09b8\u09bf\u0986\u0987\u09aa\u09bf), \u09a8\u09bf\u09aa\u09be \u0997\u09cd\u09b0\u09c1\u09aa\u09c7\u09b0 \u09aa\u09cd\u09b0\u09a4\u09bf\u09b7\u09cd\u09a0\u09be\u09a4\u09be, \u098f\u099f\u09bf \u09aa\u09cd\u09b0\u09a4\u09bf\u09b7\u09cd\u09a0\u09be \u0995\u09b0\u09c7\u09a8\u0964", "\u09e8\u09e6\u09e7\u09eb \u09b8\u09be\u09b2\u09c7\u09b0 \u09e7 \u099c\u09be\u09a8\u09c1\u09af\u09bc\u09be\u09b0\u09bf \u09e8,\u09e8\u09e6\u09e6 \u09b6\u09bf\u0995\u09cd\u09b7\u09be\u09b0\u09cd\u09a5\u09c0 \u09a8\u09bf\u09af\u09bc\u09c7 \u09b8\u09cd\u0995\u09c1\u09b2\u09c7\u09b0 \u09af\u09be\u09a4\u09cd\u09b0\u09be \u09b6\u09c1\u09b0\u09c1 \u09b9\u09af\u09bc\u0964", "\u09a6\u09b6\u09a4\u09b2\u09be \u09ad\u09ac\u09a8\u09c7 \u09aa\u09cd\u09b2\u09c7 \u0997\u09cd\u09b0\u09c1\u09aa \u09a5\u09c7\u0995\u09c7 \u09a6\u09cd\u09ac\u09be\u09a6\u09b6 \u09b6\u09cd\u09b0\u09c7\u09a3\u09bf \u09aa\u09b0\u09cd\u09af\u09a8\u09cd\u09a4 \u099c\u09be\u09a4\u09c0\u09af\u09bc \u09b6\u09bf\u0995\u09cd\u09b7\u09be\u0995\u09cd\u09b0\u09ae\u09c7\u09b0 \u09ac\u09be\u0982\u09b2\u09be \u0993 \u0987\u0982\u09b0\u09c7\u099c\u09bf \u09a6\u09c1\u0987 \u09ad\u09be\u09b0\u09cd\u09b8\u09a8\u09c7\u0987 \u09aa\u09be\u09a0\u09a6\u09be\u09a8 \u09b9\u09af\u09bc\u0964", "\u09b2\u0995\u09cd\u09b7\u09cd\u09af: \u09b6\u09bf\u0995\u09cd\u09b7\u09be\u09b0\u09cd\u09a5\u09c0\u09b0\u09be \u09b6\u09be\u09b0\u09c0\u09b0\u09bf\u0995, \u09ae\u09be\u09a8\u09b8\u09bf\u0995 \u0993 \u0986\u09a7\u09cd\u09af\u09be\u09a4\u09cd\u09ae\u09bf\u0995\u09ad\u09be\u09ac\u09c7 \u09a8\u09bf\u099c\u09c7\u09a6\u09c7\u09b0 \u09aa\u09c2\u09b0\u09cd\u09a3 \u09b8\u09ae\u09cd\u09ad\u09be\u09ac\u09a8\u09be \u09ac\u09bf\u0995\u09b6\u09bf\u09a4 \u0995\u09b0\u09c7 \u09a6\u09be\u09af\u09bc\u09bf\u09a4\u09cd\u09ac\u09b6\u09c0\u09b2 \u09ac\u09bf\u09b6\u09cd\u09ac\u09a8\u09be\u0997\u09b0\u09bf\u0995 \u09b9\u09ac\u09c7\u0964"]}, {"t": {"en": "Codes", "bn": "\u0995\u09cb\u09a1"}, "en": ["EIIN: 137368", "School code: 1417", "College code: 1290"], "bn": ["\u0987\u0986\u0987\u0986\u0987\u098f\u09a8 (EIIN): \u09e7\u09e9\u09ed\u09e9\u09ec\u09ee", "\u09b8\u09cd\u0995\u09c1\u09b2 \u0995\u09cb\u09a1: \u09e7\u09ea\u09e7\u09ed", "\u0995\u09b2\u09c7\u099c \u0995\u09cb\u09a1: \u09e7\u09e8\u09ef\u09e6"]}, {"t": {"en": "Sections & shifts", "bn": "\u09b6\u09be\u0996\u09be \u0993 \u09b6\u09bf\u09ab\u099f"}, "en": ["Pre-primary: Play, Nursery and KG", "Primary: Class I to V", "Senior: Class VI to X", "College: Class XI to XII", "Every section has a Morning shift and a Day shift.", "Streams in college: Science, Humanities and Business Studies.", "The school has a Junior Wing and a Senior Wing."], "bn": ["\u09aa\u09cd\u09b0\u09bf-\u09aa\u09cd\u09b0\u09be\u0987\u09ae\u09be\u09b0\u09bf: \u09aa\u09cd\u09b2\u09c7, \u09a8\u09be\u09b0\u09cd\u09b8\u09be\u09b0\u09bf \u0993 \u0995\u09c7\u099c\u09bf", "\u09aa\u09cd\u09b0\u09be\u0987\u09ae\u09be\u09b0\u09bf: \u09e7\u09ae \u09a5\u09c7\u0995\u09c7 \u09eb\u09ae \u09b6\u09cd\u09b0\u09c7\u09a3\u09bf", "\u09b8\u09bf\u09a8\u09bf\u09af\u09bc\u09b0: \u09ec\u09b7\u09cd\u09a0 \u09a5\u09c7\u0995\u09c7 \u09e7\u09e6\u09ae \u09b6\u09cd\u09b0\u09c7\u09a3\u09bf", "\u0995\u09b2\u09c7\u099c: \u098f\u0995\u09be\u09a6\u09b6 \u0993 \u09a6\u09cd\u09ac\u09be\u09a6\u09b6 \u09b6\u09cd\u09b0\u09c7\u09a3\u09bf", "\u09aa\u09cd\u09b0\u09a4\u09bf\u099f\u09bf \u09b6\u09be\u0996\u09be\u09af\u09bc \u09ae\u09b0\u09cd\u09a8\u09bf\u0982 \u09b6\u09bf\u09ab\u099f \u0993 \u09a1\u09c7 \u09b6\u09bf\u09ab\u099f \u0986\u099b\u09c7\u0964", "\u0995\u09b2\u09c7\u099c\u09c7 \u09ac\u09bf\u099c\u09cd\u099e\u09be\u09a8, \u09ae\u09be\u09a8\u09ac\u09bf\u0995 \u0993 \u09ac\u09cd\u09af\u09ac\u09b8\u09be\u09af\u09bc \u09b6\u09bf\u0995\u09cd\u09b7\u09be \u09ac\u09bf\u09ad\u09be\u0997 \u0986\u099b\u09c7\u0964", "\u09b8\u09cd\u0995\u09c1\u09b2\u09c7 \u099c\u09c1\u09a8\u09bf\u09af\u09bc\u09b0 \u0989\u0987\u0982 \u0993 \u09b8\u09bf\u09a8\u09bf\u09af\u09bc\u09b0 \u0989\u0987\u0982 \u0986\u099b\u09c7\u0964"]}, {"t": {"en": "Facilities", "bn": "\u09b8\u09c1\u09af\u09cb\u0997-\u09b8\u09c1\u09ac\u09bf\u09a7\u09be"}, "en": ["Computer lab: two modern labs with more than 60 computers. Computer class is compulsory, one period every week for each section.", "Science labs: well-furnished Physics, Chemistry and Biology labs. The roof garden works as the Agricultural Lab.", "Digital classrooms: three fully equipped digital classrooms with interactive teaching aids.", "Library: a large common library with Bangla and English books. Open every day from 9:00 am to 2:00 pm. Each section also gets one library period every week (except public exam candidates).", "Transport: school buses run on four routes (see Transport below)."], "bn": ["\u0995\u09ae\u09cd\u09aa\u09bf\u0989\u099f\u09be\u09b0 \u09b2\u09cd\u09af\u09be\u09ac: \u09ec\u09e6\u099f\u09bf\u09b0 \u09ac\u09c7\u09b6\u09bf \u0995\u09ae\u09cd\u09aa\u09bf\u0989\u099f\u09be\u09b0\u09b8\u09b9 \u09a6\u09c1\u099f\u09bf \u0986\u09a7\u09c1\u09a8\u09bf\u0995 \u09b2\u09cd\u09af\u09be\u09ac\u0964 \u0995\u09ae\u09cd\u09aa\u09bf\u0989\u099f\u09be\u09b0 \u0995\u09cd\u09b2\u09be\u09b8 \u09ac\u09be\u09a7\u09cd\u09af\u09a4\u09be\u09ae\u09c2\u09b2\u0995, \u09aa\u09cd\u09b0\u09a4\u09bf\u099f\u09bf \u09b6\u09be\u0996\u09be\u09b0 \u09b8\u09aa\u09cd\u09a4\u09be\u09b9\u09c7 \u098f\u0995\u099f\u09bf \u09aa\u09bf\u09b0\u09bf\u09af\u09bc\u09a1\u0964", "\u09ac\u09bf\u099c\u09cd\u099e\u09be\u09a8\u09be\u0997\u09be\u09b0: \u09b8\u09c1\u09b8\u099c\u09cd\u099c\u09bf\u09a4 \u09aa\u09a6\u09be\u09b0\u09cd\u09a5\u09ac\u09bf\u099c\u09cd\u099e\u09be\u09a8, \u09b0\u09b8\u09be\u09af\u09bc\u09a8 \u0993 \u099c\u09c0\u09ac\u09ac\u09bf\u099c\u09cd\u099e\u09be\u09a8 \u09b2\u09cd\u09af\u09be\u09ac\u0964 \u099b\u09be\u09a6-\u09ac\u09be\u0997\u09be\u09a8 \u0995\u09c3\u09b7\u09bf \u09b2\u09cd\u09af\u09be\u09ac \u09b9\u09bf\u09b8\u09c7\u09ac\u09c7 \u0995\u09be\u099c \u0995\u09b0\u09c7\u0964", "\u09a1\u09bf\u099c\u09bf\u099f\u09be\u09b2 \u0995\u09cd\u09b2\u09be\u09b8\u09b0\u09c1\u09ae: \u0986\u09a7\u09c1\u09a8\u09bf\u0995 \u09a1\u09bf\u099c\u09bf\u099f\u09be\u09b2 \u09b6\u09bf\u0995\u09cd\u09b7\u09be-\u0989\u09aa\u0995\u09b0\u09a3\u09b8\u09b9 \u09a4\u09bf\u09a8\u099f\u09bf \u09aa\u09c2\u09b0\u09cd\u09a3 \u09b8\u099c\u09cd\u099c\u09bf\u09a4 \u09a1\u09bf\u099c\u09bf\u099f\u09be\u09b2 \u0995\u09cd\u09b2\u09be\u09b8\u09b0\u09c1\u09ae\u0964", "\u09b2\u09be\u0987\u09ac\u09cd\u09b0\u09c7\u09b0\u09bf: \u09ac\u09be\u0982\u09b2\u09be \u0993 \u0987\u0982\u09b0\u09c7\u099c\u09bf \u09ac\u0987\u09af\u09bc\u09c7 \u09b8\u09ae\u09c3\u09a6\u09cd\u09a7 \u09ac\u09a1\u09bc \u0995\u09ae\u09a8 \u09b2\u09be\u0987\u09ac\u09cd\u09b0\u09c7\u09b0\u09bf\u0964 \u09aa\u09cd\u09b0\u09a4\u09bf\u09a6\u09bf\u09a8 \u09b8\u0995\u09be\u09b2 \u09ef\u099f\u09be \u09a5\u09c7\u0995\u09c7 \u09a6\u09c1\u09aa\u09c1\u09b0 \u09e8\u099f\u09be \u09aa\u09b0\u09cd\u09af\u09a8\u09cd\u09a4 \u0996\u09cb\u09b2\u09be\u0964 \u09aa\u09be\u09ac\u09b2\u09bf\u0995 \u09aa\u09b0\u09c0\u0995\u09cd\u09b7\u09be\u09b0\u09cd\u09a5\u09c0 \u09ac\u09be\u09a6\u09c7 \u09aa\u09cd\u09b0\u09a4\u09bf\u099f\u09bf \u09b6\u09be\u0996\u09be\u09b0 \u09b8\u09aa\u09cd\u09a4\u09be\u09b9\u09c7 \u098f\u0995\u099f\u09bf \u09b2\u09be\u0987\u09ac\u09cd\u09b0\u09c7\u09b0\u09bf \u09aa\u09bf\u09b0\u09bf\u09af\u09bc\u09a1 \u0986\u099b\u09c7\u0964", "\u09af\u09be\u09a4\u09be\u09af\u09bc\u09be\u09a4: \u099a\u09be\u09b0\u099f\u09bf \u09b0\u09c1\u099f\u09c7 \u09b8\u09cd\u0995\u09c1\u09b2\u09c7\u09b0 \u0997\u09be\u09a1\u09bc\u09bf \u099a\u09b2\u09c7 (\u09a8\u09bf\u099a\u09c7 \u099f\u09cd\u09b0\u09be\u09a8\u09cd\u09b8\u09aa\u09cb\u09b0\u09cd\u099f \u09a6\u09c7\u0996\u09c1\u09a8)\u0964"]}, {"t": {"en": "Clubs & activities", "bn": "\u0995\u09cd\u09b2\u09be\u09ac \u0993 \u09b8\u09b9\u09b6\u09bf\u0995\u09cd\u09b7\u09be \u0995\u09be\u09b0\u09cd\u09af\u0995\u09cd\u09b0\u09ae"}, "en": ["Clubs: Art, Music, Science, Debate, Language, Taekwondo, Dance, and IT & Photography.", "Club activities are held every Thursday for all classes except JSC, SSC and HSC candidates.", "A cultural week is held every year with music, Hamd-Naat, extempore speech, Qirat, debate, recitation and more.", "The school also has annual sports and study tours."], "bn": ["\u0995\u09cd\u09b2\u09be\u09ac: \u0986\u09b0\u09cd\u099f, \u09ae\u09bf\u0989\u099c\u09bf\u0995, \u09b8\u09be\u09af\u09bc\u09c7\u09a8\u09cd\u09b8, \u09a1\u09bf\u09ac\u09c7\u099f, \u09b2\u09cd\u09af\u09be\u0999\u09cd\u0997\u09c1\u09af\u09bc\u09c7\u099c, \u09a4\u09be\u09af\u09bc\u0995\u09cb\u09af\u09bc\u09be\u09a8\u09cd\u09a6\u09cb, \u09a1\u09be\u09a8\u09cd\u09b8 \u098f\u09ac\u0982 \u0986\u0987\u099f\u09bf \u0993 \u09ab\u099f\u09cb\u0997\u09cd\u09b0\u09be\u09ab\u09bf\u0964", "\u099c\u09c7\u098f\u09b8\u09b8\u09bf, \u098f\u09b8\u098f\u09b8\u09b8\u09bf \u0993 \u098f\u0987\u099a\u098f\u09b8\u09b8\u09bf \u09aa\u09b0\u09c0\u0995\u09cd\u09b7\u09be\u09b0\u09cd\u09a5\u09c0 \u09ac\u09be\u09a6\u09c7 \u09b8\u09ac \u0995\u09cd\u09b2\u09be\u09b8\u09c7\u09b0 \u0995\u09cd\u09b2\u09be\u09ac \u0995\u09be\u09b0\u09cd\u09af\u0995\u09cd\u09b0\u09ae \u09aa\u09cd\u09b0\u09a4\u09bf \u09ac\u09c3\u09b9\u09b8\u09cd\u09aa\u09a4\u09bf\u09ac\u09be\u09b0 \u09b9\u09af\u09bc\u0964", "\u09aa\u09cd\u09b0\u09a4\u09bf \u09ac\u099b\u09b0 \u09b8\u09be\u0982\u09b8\u09cd\u0995\u09c3\u09a4\u09bf\u0995 \u09b8\u09aa\u09cd\u09a4\u09be\u09b9 \u09b9\u09af\u09bc, \u09a4\u09be\u09a4\u09c7 \u0997\u09be\u09a8, \u09b9\u09be\u09ae\u09a6-\u09a8\u09be\u09a4, \u0989\u09aa\u09b8\u09cd\u09a5\u09bf\u09a4 \u09ac\u0995\u09cd\u09a4\u09c3\u09a4\u09be, \u0995\u09bf\u09b0\u09be\u09a4, \u09ac\u09bf\u09a4\u09b0\u09cd\u0995, \u0986\u09ac\u09c3\u09a4\u09cd\u09a4\u09bf \u0987\u09a4\u09cd\u09af\u09be\u09a6\u09bf \u09a5\u09be\u0995\u09c7\u0964", "\u09b8\u09cd\u0995\u09c1\u09b2\u09c7 \u09ac\u09be\u09b0\u09cd\u09b7\u09bf\u0995 \u0995\u09cd\u09b0\u09c0\u09a1\u09bc\u09be \u0993 \u09b6\u09bf\u0995\u09cd\u09b7\u09be\u09b8\u09ab\u09b0\u0993 \u09b9\u09af\u09bc\u0964"]}, {"t": {"en": "Transport routes", "bn": "\u099f\u09cd\u09b0\u09be\u09a8\u09cd\u09b8\u09aa\u09cb\u09b0\u09cd\u099f \u09b0\u09c1\u099f"}, "en": ["Route 1: Betuli \u2192 Boroburi \u2192 Polashia \u2192 Kanchkura \u2192 Signboard \u2192 Dobadia \u2192 Sonar Khola Road \u2192 Helal Market Road \u2192 Panditpara \u2192 Haji Market \u2192 Sardar Bari \u2192 Molla Bari \u2192 Dakshinkhan Bazar \u2192 Chairman Bari \u2192 Amtola \u2192 Khan Plaza \u2192 KCMSC", "Route 2: Anal \u2192 Protibondhi School \u2192 Dakshinkhan Bazar \u2192 Shyamal Bag \u2192 Cartoon Factory \u2192 Nagarbaria \u2192 Chalabandh Chaiti Garments \u2192 Chalabandh Mati Mosque \u2192 Nowapara Mosque \u2192 Kazi Bari Road \u2192 KCMSC", " 09a7\u09bf \u09b8\u09cd\u0995\u09c1\u09b2 \u2192 \u09a6\u0995\u09cd\u09b7\u09bf\u09a3\u0996\u09be\u09a8 \u09ac\u09be\u099c\u09be\u09b0 \u2192 \u09b6\u09cd\u09af\u09be\u09ae\u09b2 \u09ac\u09be\u0997 \u2192 \u0995\u09be\u09b0\u09cd\u099f\u09c1\u09a8 \u09ab\u09cd\u09af\u09be\u0995\u09cd\u099f\u09b0\u09bf \u2192 \u09a8\u0997\u09b0\u09ac\u09be\u09a1\u09bc\u09c0\u09af\u09bc\u09be \u2192 \u099a\u09be\u09b2\u09be\u09ac\u09a8\u09cd\u09a6 \u099a\u09c8\u09a4\u09bf \u0997\u09be\u09b0\u09cd\u09ae\u09c7\u09a8\u09cd\u099f\u09b8 \u2192 \u099a\u09be\u09b2\u09be\u09ac\u09a8\u09cd\u09a6 \u09ae\u09be\u099f\u09bf\u09b0 \u09ae\u09b8\u099c\u09bf\u09a6 \u2192 \u09a8\u0993\u09af\u09bc\u09be\u09aa\u09be\u09a1\u09bc\u09be \u09ae\u09b8\u099c\u09bf\u09a6 \u2192 \u0995\u09be\u099c\u09c0 \u09ac\u09be\u09a1\u09bc\u09c0 \u09b0\u09cb\u09a1 \u2192 \u0995\u09c7 \u09b8\u09bf \u09ae\u09a1\u09c7\u09b2 \u09b8\u09cd\u0995\u09c1\u09b2 \u0985\u09cd\u09af\u09be\u09a8\u09cd\u09a1 \u0995\u09b2\u09c7\u099c", "\u09b0\u09c1\u099f-\u09e9: \u09ac\u09b0\u09c1\u09af\u09bc\u09be \u2192 \u09ae\u099c\u09bf\u09ac\u09b0\u09c7\u09b0 \u09ac\u09bf\u09b2\u09cd\u09a1\u09bf\u0982 \u2192 \u09b9\u09b2\u09be\u09a8 \u2192 \u09ae\u09a7\u09c1\u09ac\u09be\u0997 \u2192 \u09a8\u09bf\u09aa\u09be \u0997\u09be\u09b0\u09cd\u09ae\u09c7\u09a8\u09cd\u099f\u09b8 \u2192 \u09ac\u09bf\u09a7\u09c1\u09b0 \u09ac\u09be\u09a1\u09bc\u09c0/\u09aa\u09c1\u09b0\u09be\u09a4\u09a8 \u09a6\u0995\u09cd\u09b7\u09bf\u09a3\u0996\u09be\u09a8 \u09a5\u09be\u09a8\u09be \u09ae\u09cb\u09a1\u09bc \u2192 \u09a8\u09a6\u09cd\u09a6\u09be\u09aa\u09be\u09a1\u09bc\u09be \u0995\u09cd\u09b2\u09be\u09ac \u09ae\u09cb\u09a1\u09bc \u2192 \u0986\u0987\u09a8\u09c1\u09b8\u09ac\u09be\u0997 \u09b6\u09be\u09b9\u09c0 \u09ae\u09b8\u099c\u09bf\u09a6 \u2192 \u0986\u09ae\u09a4\u09b2\u09be \u2192 \u0996\u09be\u09a8 \u09aa\u09cd\u09b2\u09be\u099c\u09be \u2192 \u0997\u09be\u099c\u09c0 \u0995\u09ae\u09aa\u09cd\u09b2\u09c7\u0995\u09cd\u09b8 \u2192 \u0995\u09c7 \u09b8\u09bf \u09b9\u09be\u09b8\u09aa\u09 d", "Co-ordinators: Md. Hossain and Md. Humayun Kabir (Senior Wing), Mohammad Belayet Hossain (Senior Wing, Secondary), Tania Tasmin (Junior Wing, Pre-Primary), Md. Hafizur Rahman, Najmun Nahar"], "bn": ["\u099a\u09c7\u09af\u09bc\u09be\u09b0\u09ae\u09cd\u09af\u09be\u09a8: \u09ae\u09cb. \u0996\u09b8\u09b0\u09c1 \u099a\u09cc\u09a7\u09c1\u09b0\u09c0 (\u09b8\u09bf\u0986\u0987\u09aa\u09bf)", "\u09ad\u09be\u0987\u09b8 \u099a\u09c7\u09af\u09bc\u09be\u09b0\u09ae\u09cd\u09af\u09be\u09a8: \u09a8\u09bf\u09aa\u09be \u099a\u09cc\u09a7\u09c1\u09b0\u09c0", "\u09aa\u09cd\u09b0\u09a7\u09be\u09a8 \u0989\u09aa\u09a6\u09c7\u09b7\u09cd\u099f\u09be: \u09ac\u09cd\u09b0\u09bf\u0997\u09c7\u09a1\u09bf\u09af\u09bc\u09be\u09b0 \u099c\u09c7\u09a8\u09be\u09b0\u09c7\u09b2 \u098f \u098f\u09b8 \u098f\u09ae \u09ae\u09c1\u09b6\u09ab\u09bf\u0995\u09c1\u09b0 \u09b0\u09b9\u09ae\u09be\u09a8 (\u0985\u09ac.), \u098f\u09b8\u09aa\u09bf\u09aa\u09bf, \u09aa\u09bf\u098f\u09b8\u09b8\u09bf", "\u0985\u09a7\u09cd\u09af\u0995\u09cd\u09b7: \u09aa\u09cd\u09b0\u09ab\u09c7\u09b8\u09b0 \u09ae\u09cb. \u0986\u09ac\u09cd\u09a6\u09c1\u09b2 \u09ac\u09be\u09a4\u09c7\u09a8", "\u0989\u09aa\u09be\u09a7\u09cd\u09af\u0995\u09cd\u09b7 (\u099c\u09c1\u09a8\u09bf\u09af\u09bc\u09b0 \u0989\u0987\u0982): \u09b8\u09be\u09b2\u09ae\u09be \u09ab\u0993\u099c\u09bf\u09af\u09bc\u09be \u09a8\u09c2\u09b0", "\u09ad\u09be\u09b0\u09aa\u09cd\u09b0\u09be\u09aa\u09cd\u09a4 \u0989\u09aa\u09be\u09a7\u09cd\u09af\u0995\u09cd\u09b7 (\u09b8\u09bf\u09a8\u09bf\u09af\u09bc\u09b0 \u0989\u0987\u0982, \u09ae\u09be\u09a7\u09cd\u09af\u09ae\u09bf\u0995 \u0987\u0982\u09b2\u09bf\u09b6 \u09ad\u09be\u09b0\u09cd\u09b8\u09a8 \u0993 \u0989\u099a\u09cd\u099a \u09ae\u09be\u09a7\u09cd\u09af\u09ae\u09bf\u0995): \u098f \u0995\u09c7 \u098f\u09ae \u09ae\u09be\u09b9\u09ac\u09c1\u09ac \u09b9\u09be\u09b8\u09be\u09a8", "\u09ad\u09be\u09b0\u09aa\u09cd\u09b0\u09be\u09aa\u09cd\u09a4 \u0989\u09aa\u09be\u09a7\u09cd\u09af\u0995\u09cd\u09b7 (\u099c\u09c1\u09a8\u09bf\u09af\u09bc\u09b0 \u0989\u /* ---- KCMAC calculator ---- */
let cur='0',prev=null,op=null,fresh=false,expr='';
const fmt=n=>String(parseFloat(Number(n).toPrecision(12)));
const calc=(a,b,o)=>{a=+a;b=+b;return o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:b===0?NaN:a/b};
function upd(){$('#out').textContent=cur==='Error'?T[L].err:cur;$('#expr').textContent=expr}
function bad(){cur='Error';prev=null;op=null;expr='';fresh=true}
function press(k){
  if(cur==='Error'&&k!=='C'&&!/[\d.]/.test(k)){return}
  if(/^\d$/.test(k)){if(fresh||cur==='0'||cur==='Error')cur=k;else if(cur.replace(/\D/g,'').length<12)cur+=k;fresh=false}
  else if(k==='.'){if(fresh||cur==='Error'){cur='0.';fresh=false}else if(!cur.includes('.'))cur+='.'}
  else if('+−×÷'.includes(k)){
    if(op&&!fresh){const r=calc(prev,cur,op);if(!isFinite(r))return bad()||upd();cur=fmt(r)}
    prev=cur;op=k;fresh=true;expr=cur+' '+k}
  else if(k==='='){if(!op)return;const r=calc(prev,cur,op);expr=prev+' '+op+' '+cur+' =';if(!isFinite(r)){bad();expr=''}else{cur=fmt(r);prev=null;op=null;fresh=true}}
  else if(k==='C'){cur='0';prev=null;op=null;fresh=false;expr=''}
  else if(k==='⌫'){if(!fresh){cur=cur.length>1?cur.slice(0,-1):'0';if(cur==='-')cur='0'}}
  else if(k==='%'){cur=fmt(+cur/100);fresh=true}
  else if(k==='±'){if(cur!=='0')cur=cur[0]==='-'?cur.slice(1):'-'+cur}
  upd();
}
